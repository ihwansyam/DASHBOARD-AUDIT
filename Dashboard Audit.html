tulis bahwa apabila ke depannya hal ini terjadi kembali, bersedia diberikan sanksi berupa Surat Peringatan.", "paD": "2026-11-03", "paS": "Selesai", "evca": [], "evpa": []}, {"fakta": "", "akar": "Penginputan data ke rekording dan sistem ERP/Portal tetap diterima tanpa LHK yang telah diverifikasi sebagai syarat penginputan.", "risiko": "Potensi penggelapan aset (ayam, pakan, dan OVK) tidak terdeteksi karena tidak ada dokumen pembanding di tingkat kandang", "ca": "", "caD": "", "caS": "-", "pa": "Area Manager melakukan pengecekan LHK di Farm Bunut setiap 1 minggu sekali selama masa pemeliharaan, dan melaporkan hasilnya kepada VP Broiler Commercial", "paD": "2026-11-07", "paS": "Selesai", "evca": [], "evpa": []}]}, {"id": "s9", "no": 9, "tgl": "2026-10-21", "bulan": "Oktober", "ent": "Broiler", "wil": "Pantura", "farm": "Tanggulun", "kdg": "Kandang 1 - 2", "judul": "TERJADI PENINGKATAN KEMATIAN (DEPLESI) DI ATAS STANDAR (0,1%/HARI)", "kat": "High Risk", "er": "", "el": "52.697.788", "rc": "", "pts": [{"fakta": "Hasil kunjungan lapangan dan hasil riview data recordin Farm menunjukan bahwa deplesi\nharian kandang tanggulun I melampaui standar % per hari,dengan rician sebagai\nberikut:\n1. Deplesi harian meningkat selama 3 hari terakhir : umur 22 hari umur 23\ndan umur 24 hari\n2. Seluruh angka tersebut malampaui standar harian\n3. Deplesi kumulatif per 21 Oktober 2026 mencapai 7.71%.\n4. Adanya pemberian pakan di bawah standar pada hari sabtu umur 22 hari tanggal 17 Oktober 2026 sebanyak 80 zak aktual dan standar yang direkomendasikan sebesar 114 zak", "akar": "Pengiriman pakan terlambat karena truk pakan masih mengantri di Pabrik Global (De Heus) dan Farm Tanggulun tidak memiliki stok pakan cadangan yang cukup untuk menutup keterlambatan tersebut", "risiko": "Kekosongan pakan dan kurangnya air minum membuat pertumbuhan ayam\nterhambat dan ayam mengalami dehidrasi, sehingga bobot badan tidak sesuai standar umur dan kematian berpotensi meningkat mulai umur 15 hari.", "ca": "Yudi Subagja (Admin garm), dan Mahpudin (SPV farm) melakukan pengajuan\npenjualan ayam kecil kepada marketing dengan melampirkan data jumlah dan kondisi\navam.", "caD": "2026-10-22", "caS": "Selesai", "pa": "Yudi Subagja (Admin Farm), Mahpudin (SPV Farm) dan Taufik Priatna (Area Manager)\nmemantau stok pakan untuk memastikan ketersediaan pakan minimal untuk3 hari ke\ndepan sebelum Stok habis. Hal ini untuk mengantisipasi keterlambatan pengiriman\ndari pabrik pakan, dengan merevisi pengajuan pakan selama 1 periode di periode\nselanjutnya.", "paD": "2026-10-25", "paS": "Selesai", "evca": [], "evpa": []}, {"fakta": "", "akar": "Ketersediaan air minum di Farm Tanggulun belum mencukupi kebutuhan ayam karena debit surnur kurang.", "risiko": "Kondisi ayam yang melemah dan tidak seragam membuat seleksi/afkir (culling) harus dilakukan Iagi, sehingga jumlah ayam yang layak dipelihara berkurang dan menimbulkan kerugian bagi perusahaan", "ca": "Yudi subagja (Admin Farm), dan Mahpuding (SPV Fram) melakukan pembelian air\nuntuk menutupi kekurangan kebutuhan konsumsi avam.", "caD": "2026-10-22", "caS": "Selesai", "pa": "Mahpudin (SPV Farm) dan Taufik Priatna (Area Manager) berkoordinasi dengan\nDeden (ME Manager) untuk mengajukan biaya penambahan kedalaman surnur atau\npembuatan sumur baru untuk memastikan ketersediaan air yang mencukupi\nkebutuhan operasional farm secara berkelanjutan. Pengajuan ini diketahui Oleh VP\nBroiler.", "paD": "2026-11-09", "paS": "Belum Selesai", "evca": [], "evpa": []}]}, {"id": "s10", "no": 10, "tgl": "2026-10-21", "bulan": "Oktober", "ent": "Broiler", "wil": "Pantura", "farm": "Tanggulun", "kdg": "Kandang 1 - 2", "judul": "[APORAN HARIAN KANDANG LHK) OLEH Spv FARM TIDAK BERJALAN", "kat": "Medium Risk", "er": "", "el": "", "rc": "", "pts": [{"fakta": "LHK periode 5 Farm Tanggulun tidak diverifikasi Oleh SPV sejak ayam masuk (DOC\numur I hari) hingga umur 26 hari (20 Oktober 2026). Hal ini terlihat dari tidak adanya paraf verifikasi SPV pada LHK", "akar": "SPV Farm (Mahpudin) tidak menjalankan verifikasi LHK sejak DOC karena memprioritaskan pekerjaan lain.", "risiko": "Data harian recording berpotensi tidak akurat karena LHK diinput tanpa verifikasi SPV, sehingga kesalahan pencatatan tidak terdeteksi.", "ca": "Mahpudin (SVP Farm) wajib melakukan verifikasi dan kontrol kesesuaian penginputan\ndata di LAK selama periode selanjutnya.", "caD": "2026-10-22", "caS": "Selesai", "pa": "Taufik (Area Manager) dan Ihsan (HCSP) melakukan sosialisasi ulang Sk Direksi\nNomor: 160/DIREKSI-MBUSK/X/2025 Terkait penginputan data recording kepada\nseluruh admin Farm, SPV dan ABK (Anak Buah Kandang) dengan melampirkan Serita\nacara proses sosialisasi yang dilakukan.", "paD": "2026-11-14", "paS": "Belum Berjalan", "evca": [], "evpa": []}, {"fakta": "", "akar": "Admin Farm (Yudi Subagja) tetap menginput data LHK ke recording dan ERP tanpa memastikan ada a araf verifikasi SPV.", "risiko": "Laporan farm menjadi bias dan tidak akurat, sehingga dapat memengaruhi\npengambilan keputusan manajemen dan menyebabkan farm tidak mematuhi SK Direksi.", "ca": "", "caD": "", "caS": "-", "pa": "Mahpudin (SPV Farm) dan seluruh ABK membuat Surat Pernyataan Komitmen Kerja\n(SPKK) vang menvatakan bahwa mereka telah menerima sosialisasi SK Direksi\ntersebut dan akan menjalankannya secara konsisten. Apabila di kemudian hari SK\ntersebut tidak dijalankan, mereka bersedia diberikan sanksi berupa Surat peringatan.", "paD": "2026-11-14", "paS": "Belum Selesai", "evca": [], "evpa": []}]}, {"id": "s11", "no": 11, "tgl": "2026-10-21", "bulan": "Oktober", "ent": "Broiler", "wil": "Pantura", "farm": "Tanggulun", "kdg": "Kandang 1 - 2", "judul": "SECURITY TIDAK KONSISTEN MENERAPKAN PENYEMPROTAN DESINFEKTAN KENDARAAN DAN PENCATATAN BUKU TAMU", "kat": "", "er": "", "el": "", "rc": "", "pts": [{"fakta": "Berdasarkan observasi langsung Saat kunjungan audit ke Farm Tanggulun pada 21 Oktober 2026, diternukan bahwa petugas security belum konsisten menerapkan prosedur\nblosecurity masuk farm, dengan rincian sebagai berikut:\nI. Penyemprotan desinfektan terhadap kendaraan yang masuk farm baru dilakukan setelah Auditor mengingatkan petugas security.\n2. Buku tarnu tidak diserahkan Oleh petugas security Saat pemeriksaan Auditor, dan pencatatan terakhir pada buku tamu hanva sampai bulan Agustus, sehingga tidak\nada catatan kunjungan tamu setelah bulan tersebut", "akar": "Petugas security belum menjalankan tugas dan tanggung jawab sesuai job description dan SOP biosecurity secara konsisten karena pengawasan dan evaluasi berkala terhadap kinerja\nsecurity belum berjalan optimal, sehingga penyemprotan desinfektan kendaraan dan pembaruan buku tarnu tidak dilaksanakan sesuai prosedur.", "risiko": "Meningkatkan Risiko masuk dan menyebarkan penyakit ke area Farm akibat kendaraan\nyang tidak disemprot desinfektan,serta pengendalian akses dan penelusuran pengunjung\nkarena pencatatan buku tamu tidak diperbarui. Kondisi ini berpotensi menganggu Kesehatan ayam dan menimbulkan kerugian finasial perusahaan.", "ca": "Auditor menginstruksikan petugas security untuk segera menyemprotkan desinfektan\npada setiap kendaraan yang masuk ke area farm.", "caD": "2026-10-21", "caS": "Selesai", "pa": "Taufik priatna (Area Manager) dan Ihsan (HCSp) melakukan Koordinasi dengan Pihak\noutsourcing (PPN) wajib melakukan pengawasan dan evaluasi secara berkala terhadap kinerja karyawan Pihak Outsourcing (ABK, petugas security, dan karyawan Iainnya) khususnya kepatuhan terhadap SOP-SOP yang dibuat dan diberlakukan Oleh Management Perusahaan dengan melampirkan komitmen dari Koordinator Outsourcing (ppN).", "paD": "2026-10-30", "paS": "Belum Selesai", "evca": [], "evpa": []}, {"fakta": "", "akar": "", "risiko": "", "ca": "SPV segera menginstruksikan petugas security untuk mencatat siapapun yang masuk ke dalam farm sesuai kondisi aktual dan memastikan seluruh kunjungan tercatat dengan lengkap.", "caD": "2026-10-21", "caS": "Selesai", "pa": "Nandang Koswara dan Rizky Nuurhidayat (Security farm) membuat Surat Pernvataan Komitmen Kerja (SPKK) yang menyatakan bahwa mereka telah menerima sosialisasi SK Direksi tersebut dan akan menjalankannya secara konsisten. Apabila di kemudian hari SK tersebut tidak dijalankan, mereka bersedia diberikan sanksi berupa Surat peringatan.", "paD": "2026-11-14", "paS": "Belum Selesai", "evca": [], "evpa": []}]}, {"id": "s12", "no": 12, "tgl": "2026-10-22", "bulan": "Oktober", "ent": "LTI", "wil": "Priangan", "farm": "Darawati", "kdg": "Kandang 1 -22", "judul": "PERBEDAAN JUMLAH STOCK TELUR VS DATA HITUNGAN", "kat": "High Risk", "er": "8.196.793", "el": "0", "rc": "0", "pts": [{"fakta": "Stok fisik telur Farm layer Darawati tercatat 21.550 butir dengan 1.204,95 kg, sedangkan data sesuai hasil recording mencatat 15.662 butir dengan 894,31 kg, sehingga terdapat kelebihan 5.888 butir (37,49%) dan kelebihan 310,64 kg (34,73%)", "akar": "Belum tersedianya Standar Operasional Prosedur (SOP) terkait pencatatan dan pelaporan stok\nharian telur", "risiko": "Tanpa aturan baku (tidak adanya SOP) mengenai tata cara pencatatan produksi telur, penjualan telur, grading telur dan stock telur di gudang akan terus berselisih dengan data sistem (ERP)", "ca": "Syaiful Muchtar (Head Farm) melakukan pengisian form harian laporan stock telur dari tanggal 8 — 21 oktober 2026 dan melaporkannya setiap hari.", "caD": "2026-10-25", "caS": "Selesai", "pa": "Rishad Alfriandi (Area Manager), Tris Nur Muhammad (Tim database) bersama Irza Aulia Zaim (Management System Manager) menyusun, mengesahkan, dan mensosialisasikan SOP Produksi Telur, yang mengatur:\na. Pencatatan penerimaan telur dari kandang ke gudang;\nb. Penyimpanan telur di gudang;\nc. Pengeluaran telur dari gudang berdasarkan dokumen penjualan/surat jalan;\nd. Pemeriksaan stok dan pembaruan kartu stok Oleh Admin gudang setiap kali terjadi penjualan, yang diverifikasi Oleh SPV Gudang\ne. Stok opname dan rekonsiliasi kartu stok dengan data ERP setiap [frekuensi], yang direview Oleh Head Farm dan Tim Database.\nf. Proses pembuatan Surat Jalan Penjualan dan proses penginputan surat jalan penjualan telur ke customer\ng. Pengisian dan pelaporan form laporan telur", "paD": "2026-11-11", "paS": "Belum Selesai", "evca": [], "evpa": []}, {"fakta": "", "akar": "Tingginya beban kerja operasional yang dilakukan Oleh Syaiful Muchtar (Head farm), yaitu produksi, wharehouse (Grading — penjualan telur), dan BOP (pengajuan — realisasi pemebelian).", "risiko": "Melakukan pekerjaan dari hulu ke hilir sekaligus dapat membuat fokus kerja terbagi, sehingga rawan terjadi keterlambatan pencatatan, selisih stok telur fisik vs sistem, atau salah hitung dalam realisasi pembelian.", "ca": "Syaiful Muchtar (Head Farm), Rishad Alfriandi (Area Manager), dan Tris Nur Muhammad (Manager Database) merekonsiliasi transaksi produksi dan penjualan periode 16 September — 22 Oktober 2026 antara ERP dan data farm, serta mengoreksi data yang salah serta melakukan penyesuaian stok (stock adjustment) di ERP sesuai stok fisik per 22 Oktober 2026 kepada team IT. Penyesuaian dituangkan dalam Berita Acara yang disetujui Rishad Alfriandi (Area Manager) dan diketahui rendy Perdana Rudy (Cost Accounting Manager)", "caD": "2026-11-10", "caS": "Belum Selesai", "pa": "Rishad Alfriandi (Area Manager) dan Banu Nandatama (Production Vice President) bersama Marcheline (HCBP) melakukan evaluasi terkait Struktur organisasi dan Job Profil di farm serta melakukan penambahan man power untuk kebutuhan administrasi farm apabila kajian terkait Struktur Organisasi telah selesai", "paD": "2026-11-10", "paS": "Belum Selesai", "evca": [], "evpa": []}, {"fakta": "", "akar": "Syaiful Muchtar (Head Farm) tidak konsisten melakukan pencatatan harian di form laporan stock telur", "risiko": "Data stok di ERP tidak akurat, sehingga laporan stok dan laporan keuangan tidak mencerminkan\nkondisi sebenarnya. Hal ini dapat membuat manajemen mengambil keputusan yang keliru. Selain itu, selisih atau kehilangan telur tidak terdeteksi, sehingga aset telur berisiko hilang atau disalahgunakan.", "ca": "", "caD": "", "caS": "-", "pa": "", "paD": "", "paS": "-", "evca": [], "evpa": []}, {"fakta": "", "akar": "Surat jalan penjualan telur yang sudah dibagikan di grup dan diinput Admin Marketing sering mengalami perubahan 1—2 hari setelah pelaporan, karena terjadi penyesuaian jumlah telur yang diterima Oleh pelanggan.", "risiko": "Angka pada sistem ERP belum dapat diandalkan akibat seringnya revisi surat jalan penjualan setelah pelaporan (H+l s.d. H+2) serta kesalahan input klasifikasi kategori telur (utuh vs retak/putih)", "ca": "", "caD": "", "caS": "-", "pa": "", "paD": "", "paS": "-", "evca": [], "evpa": []}]}, {"id": "s13", "no": 13, "tgl": "2026-10-22", "bulan": "Oktober", "ent": "LTI", "wil": "Priangan", "farm": "Darawati", "kdg": "Kandang 1 - 22", "judul": "KETIDAKSESUAIAN JUMLAH STOCK PAKAN FISIK VS DATA HITUNGAN", "kat": "Medium Risk", "er": "1.090.040", "el": "0", "rc": "0", "pts": [{"fakta": "Hasil penghitungan fisik stok telur di Farm Layer Darawati pada tanggal 22 Oktober 2026 menunjukkan kondisi berikut:\n1. Stok fisik pakan Farm layer Darawati tercatat 9.995 kg, sedangkan data sesuai hasil recording mencatat 9.855 kg, sehingga terdapat kelebihan 140 kg (1,42%).", "akar": "Penyimpanan pakan tersebar di masing-masing kandang tanpa pengawasan terpusat, dengan\npengelolaan dan pemberian pakan sepenuhnya diserahkan kepada operator kandang.", "risiko": "Operator cenderung memberikan pakan secara subjektif (overfeeding atau underfeeding), yang berdampak langsung pada kestabilan bobot badan ayam dan penurunan tingkat produksi telur harian (hen-day).", "ca": "Syaiful Muchtar (Head Farm), Rishad Alfriandi (Area Manager) segera menyediakan timbangan digital atau gantung yang terkalibrasi di setiap kandang/gudang dan menginstruksikan operator untuk langsung menghentikan penakaran manual menggunakan gayung.", "caD": "2026-10-28", "caS": "Selesai", "pa": "Syaiful Muchtar (Head Farm) wajib memverifikasi dan menghitung ulang jumlah pemberian serta sisa pakan dari operator menggunakan formulir pemberian pakan sebelum data diinput ke dalam sistem.", "paD": "2026-11-10", "paS": "Belum Selesai", "evca": [], "evpa": []}, {"fakta": "", "akar": "Belum konsistennya proses stock opname pakan Oleh Head farm setelah operator selesai melakukan pemberian pakan dan pencatatan pakan tersebut juga tidak diverifikasi Oleh SPV maupun Head Farm.", "risiko": "Penakaran pakan yang tidak presisi menggunakan gayung berisiko membuat ayam kekurangan pakan (underfeeding) atau kelebihan pakan (overfeeding). Kondisi ini dapat mengganggu kestabilan berat badan ayam dan langsung menurunkan persentase produksi telur (hen-day production) dan membuat perhitungan rasio konversi pakan (Nilai FCR) menjadi bias.", "ca": "Syaiful Muchtar (Head Farm), Rishad Alfriandi (Area Manager), dan Tris Nur Muhammad (Manager Database) merekonsiliasi pemakaian pakan periode 16 September — 22 Oktober 2026 antara ERP dan data farm/database, serta mengoreksi data yang salah.", "caD": "2026-11-10", "caS": "Belum Selesai", "pa": "Rishad Alfriandi (Area Manager), Tris Nur Muhammad (Tim database) bersama Irza Aulia Zaim (Management System) menyusun, mengesahkan, dan mensosialisasikan SOP Pengelolaan Pakan, yang mengatur:\na. Penerimaan pakan dari pabrik dan mutasi pakan masuk/keluar\nb. Penetapan standar takaran dan alat takar pakan yang terkalibrasi (kg per takaran), serta penimbangan dan pencatatan pemakaian pakan harian\nc. Pengisian kartu stok pakan setiap kali terjadi penerimaan, mutasi, dan pemakaian, yang diverifikasi Oleh SPV\nd. Stok opname pakan setiap [frekuensi] dan rekonsiliasinya dengan data ERP, yang direview Oleh Farm Operations SPV dan Tim Database; dan\ne. Proses penginputan pakan.", "paD": "2026-11-11", "paS": "Belum Selesai", "evca": [], "evpa": []}, {"fakta": "", "akar": "", "risiko": "Data stok pakan tidak akurat dan angka pemakaian pakan yang dilaporkan operator tidak terverifikasi kebenarannya, sehingga saldo persediaan pakan di gudang berisiko tidak sesuai dengan fisik riil", "ca": "Berdasarkan hasil rekonsiliasi, Tris Nur Muhammad (Tim Database) bersama Lingkan Putri Wulan Pangkey (Product Management Supervisor) melakukan penyesuaian stok (stock adjustment) pakan di ERP sesuai stok fisik per 22 Oktober 2026. Penyesuaian dituangkan dalam Berita Acara yang disetujui Rishad Alfriandi (Area Manager) dan diketahui Chandra Mardiana Mulyono (Accounting Supervisor)", "caD": "2026-11-10", "caS": "Belum Selesai", "pa": "", "paD": "", "paS": "-", "evca": [], "evpa": []}]}, {"id": "s14", "no": 14, "tgl": "2026-10-22", "bulan": "Oktober", "ent": "LTI", "wil": "Priangan", "farm": "Darawati", "kdg": "Kandang 1 - 22", "judul": "PENGISIAN LAPORAN HARIAN KANDANG (LHK) OLEH OPERATOR KANDANG TIDAK KONSISTEN", "kat": "Medium Risk", "er": "0", "el": "0", "rc": "0", "pts": [{"fakta": "Darawati AI, A2, A4, A5: Tidak ada lembar kertas laporan harian kandang (LHK).", "akar": "Tidak tersedianya lembaran form LHK di kandang.", "risiko": "Penginputan data ke sistem hanya mengandalkan laporan operator via grup WhatsApp tanpa\ndokumen fisik, sehingga data FCR, populasi, dan persediaan di ERP menjadi bias serta menghilangkan\nriwayat penelusuaran harian secara resmi.", "ca": "Syaiful Muchtar (Head Farm) berkoordinasi dengan Rishad Alfriandi (Area Manager) untuk mencetak dan mendistribusikan formulir LHK ke kandang A1, A2, A4, dan A5, melengkapi pengisian data LHK kandang B2 periode 13—22 Oktober 2026 berdasarkan data pencatatan riil, serta menjaga ketersediaan stok formulir guna mencegah kekosongan lembar LHK di kandang.", "caD": "2026-11-01", "caS": "Belum Selesai", "pa": "Syaiful Muchtar (Head Farm) wajib mengelola dan memantau persediaan lembar formulir LHK dengan batas minimum pengadaan ulang (pengadaan dilakukan ketika stock tersedia hanaya 20 lembar lagi), guna mencegah ketergantungan input berbasis grup WhatsApp dan menjamin ketersediaan dokumen fisik resmi sebagai jejak penelusuran harian.", "paD": "2026-11-01", "paS": "Belum Selesai", "evca": [], "evpa": []}, {"fakta": "Darawati B2: LHK sebelum tanggal 13 sudah dikerjakan dan terisi penuh, namun dari tanggal 13 Oktober — 22 oktober 2026 tidak dikerjakan karena lembar kertas LHK belum diberikan Oleh head farm.", "akar": "Belum tersedianya Standar Operasional Prosedur (SOP) terkait tata cara pengisian dan pencatatan\nLaporan Harian Kandang (LHK)", "risiko": "Ketiadaan SOP yang berkelanjutan akan mengakibatkan perbedaan berkepanjangan antara\npencatatan fisik dan sistem ERP, memicu ketidakakuratan data FCR dan mortalitas ayam, serta\nmenghilangkan fungsi kontrol kerja di lapangan.", "ca": "", "caD": "", "caS": "-", "pa": "", "paD": "", "paS": "-", "evca": [], "evpa": []}]}, {"id": "s15", "no": 15, "tgl": "2026-10-06", "bulan": "Oktober", "ent": "LTI", "wil": "Priangan", "farm": "Tamansari", "kdg": "kandang 1 - 10 dan A & B", "judul": "SELISIH PENCATATAN PRODUKSI-PENJUALAN DAN STOK TELUR ANTARA FISK, DATA FARM, DAN ERP", "kat": "High Risk", "er": "7.240.000", "el": "0", "rc": "0", "pts": [{"fakta": "Selisih pencatatan produksi dan penjualan (ERP vs data farm), periode 1 Juli — 6 Oktober 2026, dengan detil sebagai berikut Produksi +2.481 butir (0,08%) dengan -35,99 kg (0,02%), penjualan +5.110 butir (0,16%) dengan +302 kg (0,16%).", "akar": "Belum dilakukan rekonsiliasi berkala antara data ERP, data farm/kartu Stok, dan stok fisik.", "risiko": "Data stok di ERP tidak akurat, sehingga laporan stok dan laporan keuangan tidak mencerminkan\nkondisi sebenarnya. Hal ini dapat membuat manajemen mengambil keputusan yang keliru. Selain\nitu, selisih atau kehilangan telur tidak terdeteksi, sehingga aset telur berisiko hilang atau\ndisalahgunakan.", "ca": "Muhammad Nurzaman (Head Farm), Rishad Alfriandi (Area Manager), dan Tris Nur Muhammad (Tim Database) merekonsiliasi transaksi produksi dan penjualan periode 1 Juli — 6 Oktober 2026 antara ERP dan data farm, serta mengoreksi data yang salah.", "caD": "2026-11-10", "caS": "Belum Selesai", "pa": "Rishad Alfriandi (Area Manager), Tris Nur Muhammad (Tim Database) dan Irza Aulia Zaim (Management System Manager) segera menyusun, mengesahkan, dan mensosialisasikan SOP Stok Opname Telur di Gudang, yang mengatur:\na. Pencatatan penerimaan telur dari kandang ke gudang;\nb. Penyimpanan telur di Gudang.\nc. Pengeluaran telur dari gudang berdasarkan dokumen penjualan/surat jalan;\nd. Pemeriksaan stok dan pembaruan kartu stok Oleh Admin Gudang setiap kali terjadi penjualan, yang diverifikasi Oleh SPV Gudang\ne. Stok opname dan rekonsiliasi kartu stok dengan data ERP setiap [frekuensil, yang direview Oleh Head Farm dan Tim Database.\nf. Proses pembuatan Surat Jalan Penjualan dan proses penginputan surat jalan penjualan telur\nke customer", "paD": "2026-11-11", "paS": "Belum Selesai", "evca": [], "evpa": []}, {"fakta": "Selisih stok telur fisik vs catatan per 6 Oktober 2026, dengan detil sebagai berikut : berdasarkan data fisik vs ERP terdapat +8.862 butir dengan - 243,309 kg, dan berdasarkan data fisik vs data farm terdapat 11.491 butir dengan 94.681 kg.", "akar": "Surat jalan penjualan telur yang sudah dibagikan di grup dan diinput Admin Marketing sering mengalami perubahan 1—2 hari setelah pelaporan, karena terjadi penyesuaian jumlah telur yang diterima Oleh elan an.", "risiko": "Angka pada sistem ERP belum dapat diandalkan akibat seringnya revisi surat jalan penjualan setelah pelaporan (H+I s.d. H+2) serta kesalahan input klasifikasi kategori telur (utuh vs retak/putih).", "ca": "Berdasarkan hasil rekonsiliasi, Tris Nur Muhammad (Tim Database) bersama Lingkan Putri Wulan Pangkey (Product Management Supervisor) melakukan penyesuaian stok (stock adjustment) di ERP sesuai stok fisik per 6 Oktober 2026. Penyesuaian dituangkan dalam Berita Acara yang disetujui Rishad Alfriandi (Area Manager) dan diketahui rendy Perdana Rudy (Cost Accounting Manager).", "caD": "2026-11-10", "caS": "Belum Selesai", "pa": "", "paD": "", "paS": "-", "evca": [], "evpa": []}]}, {"id": "s16", "no": 16, "tgl": "2026-10-21", "bulan": "Oktober", "ent": "LTI", "wil": "Bandung Raya", "farm": "Bihbul", "kdg": "Kandang 1 - 3", "judul": "KAPASITAS GARDU LISTRIK FARM BIHBUL DAN CIBINONG TIDAK MEMADAI", "kat": "High Risk", "er": "0", "el": "0", "rc": "0", "pts": [{"fakta": "Sejak 2 Oktober 2026, Farm Bihbul (3 kandang closed house) dan Farm Cibinong (5 kandang  open house layer dan 2 kandang semi closed house pullet) menggunakan satu gardu listrik \ndengan kapasitas 300 A. Penggabungan gardu dilakukan atas keputusan pak Ali Mashudi (ME \nManager Layer). Penggabungan gardu listrik dilakukan untuk mengintegrasikan sumber  pasokan listrik MBU agar tidak tergabung dengan gardu milik pihak lain, sehingga pengelolaan penggunaan listrik dan proses pembayaran tagihan menjadi lebih terpusat, terkontrol, dan \nmudah dipantau.", "akar": "Penggabungan gardu listrik Farm Bihbul dan Cibinong serta mulai beroperasinya kandang 3 CH \nFarm Bihbul tidak disertai evaluasi kebutuhan dan penyesuaian daya terpasang, sehingga kapasitas gardu sebesar 300 Ampere tidak lagi memadai untuk memnuhi kebutuhan beban  puncak seluruh kandang sebesar 370 Ampere.", "risiko": "Gangguan kesehatan dan penurunan produksi ayam akibat terhentinya peralatan kandang,  seperti ventilasi dan pompa air, apabila listrik padam saat genset mengalami gangguan.", "ca": "Adji Ahmad Yudhanto & Ragil Marsongko (SPV Farm), Erutan Dwi Sadjiwo (ME Farm) segera  menggunakan genset sebagai langkah sementara untuk menopang beban saat listrik utama trip  atau melebihi daya terpasang.", "caD": "2026-11-22", "caS": "Selesai", "pa": "Wildan Syarif Ramadan (Area Manager) berkoordinasi dengan Ali Mashudi (ME Manager Layer)  untuk menambah gardu listrik dan/atau memisahkan gardu Farm Bihbul dari Farm Cibinong.", "paD": "2026-11-05", "paS": "Belum Selesai", "evca": [], "evpa": []}, {"fakta": "Hasil pengukuran oleh Erutan Dwi Sadjiwo (ME Farm) dan tim internal audit pada 21 Oktober  2026 pada jam 10.13 dan jam 13.00 menunjukkan beban puncak siang hari mencapai 370 A,  melebihi kapasitas 300 A sebesar 70 A (23,33%).", "akar": "Belum adanya pengajuan unuk penambahan gardu/peningkatan daya dari Farm ke PLN.", "risiko": "Kerusakan genset akibat penggunaan terus-menerus pada beban penuh, yang berisiko  menyebabkan hilangnya sumber Cadangan Listrik saat lstrik utama mengalami trip.", "ca": "Erutan Dwi Sadjiwo (ME Farm) dan Ali Mashudi (ME Manager Layer) segera untuk mengukur  beban aktual dan beban puncak untuk memvalidasi angka 300 Ampere dan 370 Ampere.", "caD": "2026-10-22", "caS": "Selesai", "pa": "", "paD": "", "paS": "-", "evca": [], "evpa": []}, {"fakta": "Berdasarkan keterangan Sdr. Adji Ahmad Yudhanto (Head Farm Cibinong dan Bihbul), gardu  mulai sering trip sejak 11 Oktober 2026, setelah chick in dan beroperasinya kandang CH 3 Farm  Bihbul. Pada 18 Oktober 2026, trip terjadi sejak pukul ±10.00 sampai ±14.30 tetapi switch ke  PLN selama 1 jam untuk istirahat sehingga genset beroperasi ±3,5 jam per hari.", "akar": "Penggunaan genset menjadi solusi sementara saat pasokan listrik utama mengalami gangguan  (trip), sehingga tidak menyelesaikan permasalahan mendasar pada sistem kelistrikan utama.", "risiko": "Peralatan listrik dapat rusak akibat pembebanan berlebih atau sistem proteksi yang tidak sesuai, \nsehingga muncul biaya perbaikan darurat dan peningkatan kapasitas.", "ca": "Erutan Dwi Sadjiwo (ME Farm), Irdiansyah (SPV ME Area) dan Wildan Syarif Ramadan (Area  Manager) segera membuat Internal Memo untuk mengajukan penambahan gardu atau  penambahan daya kepada Ali Mashudi (ME Manager Layer) dengan disetujui oleh BU VP Layer  (Syahlan) dan di ketahui oleh Management Perusahaan.", "caD": "2026-11-05", "caS": "Belum Selesai", "pa": "", "paD": "", "paS": "-", "evca": [], "evpa": []}, {"fakta": "Tersedia 2 unit genset cadangan berkapasitas 350 A/genset. Selama periode 11 - 22 Oktober 2026, genset beroperasi ±3,5 jam/hari dengan rata-rata pemakaian solar ±200 liter/hari (±Rp5.040.00).", "akar": "", "risiko": "Peningkatan biaya operasional akibat konsumsi solar setiap hari dan frekuensi pemeliharaan \ngenset.", "ca": "", "caD": "", "caS": "-", "pa": "", "paD": "", "paS": "-", "evca": [], "evpa": []}]}, {"id": "s17", "no": 17, "tgl": "2026-10-21", "bulan": "Oktober", "ent": "LTI", "wil": "Bandung Raya", "farm": "Bihbul", "kdg": "Kandang 1 - 3", "judul": "KETERBATASAN SUMBER DAN DISTRIBUSI AIR DI FARM CIBINONG", "kat": "High Risk", "er": "0", "el": "0", "rc": "0", "pts": [{"fakta": "Sumber air Farm Bihbul hanya satu titik sumur untuk 3 kandang, dengan debit sekitar 2,78 \nliter/detik atau 10 m³/jam (hasil pengukuran 4,39 liter dalam 1,58 detik). Belum ada sumber air \nalternatif.", "akar": "Wildan Syarif Ramadan (Area Manager) dan Adji Ahmad Yudhanto & Ragil Marsongko (SPV \nFarm) belum mengajukan penambahan sumur dan toren berdasarkan kebutuhan air 3 kandang.", "risiko": "Suplai air terhenti saat terjadi kerusakan pompa atau penurunan debit sumur, sehingga \nberpotensi menyebabkan terganggunya operasional farm, kebutuhan konsumsi air ayam dan \nkematian ayam.", "ca": "Erutan Dwi Sadjiwo (ME Farm) mengisntalasi toren ke-10 dan memastikan seluruh toren  berfungsi.", "caD": "2026-10-22", "caS": "Selesai", "pa": "Wildan Syarif Ramadan (Area Manager) dan Adji Ahmad Yudhanto & Ragil Marsongko (SPV  Farm) mengajukan Internal memo penambahan sumur dan toren berdasarkan perhitungan  kebutuhan air, diketahui Associate VP Layer yang ditujukan kepada BOD.", "paD": "2026-11-05", "paS": "Belum Selesai", "evca": [], "evpa": []}, {"fakta": "Penampungan air terdiri dari 10 toren (masing-masing 5.100 liter), tetapi baru 9 toren yang \nterpasang untuk melayani Kandang 1, 2, dan 3. Kebutuhan air cooling pad kandang 3 bersumber  dari sumur Farm Layer Cibinong 4 dan 5.", "akar": "Erutan Dwi Sadjiwo (ME Farm) belum menyelesaikan pemasangan toren ke-10 karena harus mengambil sumber air dari sumur Farm Layer Cibinong 4 dan 5 untuk
